name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Desktop smoke test
        if: runner.os != 'Linux'
        run: pnpm --filter @cabul8r/e2e e2e
      - name: Desktop smoke test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm --filter @cabul8r/e2e e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: e2e/test-results
          if-no-files-found: ignore
